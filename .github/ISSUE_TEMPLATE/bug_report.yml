name: Bug report
description: Report behavior that differs from Agent Loop's documented contract.
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include credentials, private repository URLs, customer data, or private prompts.
  - type: textarea
    id: behavior
    attributes:
      label: What happened?
      description: Include the expected and actual behavior.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How can we reproduce it?
      placeholder: Include sanitized commands, configuration shape, and steps.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Agent Loop version or commit
    validations:
      required: true
  - type: dropdown
    id: tracker
    attributes:
      label: Tracker
      options:
        - GitHub Issues + Projects
        - Linear
        - Not applicable
  - type: dropdown
    id: harness
    attributes:
      label: Coding harness
      options:
        - Claude Code
        - Codex
        - Cursor
        - GitHub Copilot
        - Not applicable
